server.port=8081

# AeroSaga Temporal Configuration
aerosaga.temporal.target=127.0.0.1:7233
aerosaga.temporal.task-queue=DRONE_TASK_QUEUE
aerosaga.temporal.namespace=default

# Workflow Activity Timing (simulation step delay in milliseconds)
aerosaga.activity.step-duration-ms=2500

# CORS Allowed Origins
aerosaga.cors.allowed-origins=http://localhost:5173

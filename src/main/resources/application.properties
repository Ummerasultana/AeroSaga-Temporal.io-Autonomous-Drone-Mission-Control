# Application Configuration
spring.application.name=aerosaga
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/aerosaga_db
spring.datasource.username=postgres
spring.datasource.password=Siddhi
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Temporal Configuration
aerosaga.temporal.task-queue=aerosaga-task-queue
aerosaga.temporal.workflow-type=AeroSagaMissionWorkflow